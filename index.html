<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/KR_light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/KR_dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Kevin Robin — Full-Stack Developer expanding into AI Engineering. Django, Angular, React, and LLM apps with RAG and AI agents. Based in Kozhikode, Kerala." />
    <title>Kevin Robin · Full-Stack & AI Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply saved theme before first paint; new visitors default to light
      try {
        if (localStorage.getItem('kr-portfolio-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      // The loader opens on dark walnut: paint it from the first frame so the page
      // background never flashes first (the loader removes this once mounted)
      try {
        if (sessionStorage.getItem('kr-loader-seen') !== '1') {
          document.documentElement.style.background = '#3A2E25';
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
